name: Xbox One Fat UWP graphics probe

on:
  push:
    branches: [main]
    paths:
      - 'XboxOneProbe/**'
      - 'tools/generate-probe-assets.ps1'
      - '.github/workflows/xbox-one-uwp-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-uwp-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Generate package icons
        shell: pwsh
        run: ./tools/generate-probe-assets.ps1
      - name: Compile UWP x64 native project
        shell: pwsh
        run: msbuild XboxOneProbe/XboxOneProbe.vcxproj /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false
      - name: Make and sign APPX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:GITHUB_WORKSPACE 'XboxOneProbe'
          $stage = Join-Path $env:RUNNER_TEMP 'uwp-stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item (Join-Path $folder 'x64/Release/XboxOneProbe/XboxOneProbe.exe') (Join-Path $stage 'XboxOneProbe.exe')
          Copy-Item (Join-Path $folder 'Package.appxmanifest') (Join-Path $stage 'AppxManifest.xml')
          Copy-Item (Join-Path $folder 'Assets') (Join-Path $stage 'Assets') -Recurse
          $sdk = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64'
          $make = Join-Path $sdk 'makeappx.exe'
          $sign = Join-Path $sdk 'signtool.exe'
          if (!(Test-Path $make)) { throw 'MakeAppx missing' }
          if (!(Test-Path $sign)) { throw 'SignTool missing' }
          $appx = Join-Path $folder 'PS3XboxOneFatProbe.appx'
          & $make pack /o /d $stage /p $appx
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx failed' }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=PS3XboxOneProbeDev' -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddMonths(3)
          Export-Certificate -Cert $cert -FilePath (Join-Path $folder 'PS3XboxOneProbeDev.cer') | Out-Null
          # Trust the short-lived test certificate only on this temporary CI runner
          # so SignTool can verify the package chain. Users must explicitly trust
          # the exported public cert on their own developer device if required.
          Import-Certificate -FilePath (Join-Path $folder 'PS3XboxOneProbeDev.cer') -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My $appx
          if ($LASTEXITCODE -ne 0) { throw 'SignTool failed' }
          & $sign verify /pa /v $appx
          if ($LASTEXITCODE -ne 0) { throw 'SignTool verify failed' }
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: XboxOneFat-UWP-GPU-Memory-Probe-NOT-PS3-Emulator
          path: |
            XboxOneProbe/*.appx
            XboxOneProbe/*.cer
          if-no-files-found: error
